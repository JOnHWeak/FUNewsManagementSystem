<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - FUNews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-header text-center">
                        <h4>Login - FU News Management</h4>
                    </div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" id="loginBtn">
                                    <span id="loginText">Login</span>
                                    <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2" style="display: none;"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="mt-3 text-center" id="message"></div>

                <!-- Demo Accounts Info -->
                <div class="mt-4">
                    <div class="card">
                        <div class="card-header">
                            <small class="text-muted">Demo Accounts (for testing)</small>
                        </div>
                        <div class="card-body">
                            <small class="text-muted">
                                <strong>Admin:</strong> Check appsettings.json<br>
                                <strong>Staff/Lecturer:</strong> Create via Admin panel
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            login();
        });

        async function login() {
            const emailInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");
            const messageDiv = document.getElementById("message");
            const loginBtn = document.getElementById("loginBtn");
            const loginText = document.getElementById("loginText");
            const loginSpinner = document.getElementById("loginSpinner");

            // Check if elements exist
            if (!emailInput || !passwordInput) {
                console.error("Email or password input not found");
                return;
            }

            const email = emailInput.value ? emailInput.value.trim() : "";
            const password = passwordInput.value || "";

            // Validation
            if (!email || !password) {
                showMessage("Please enter both email and password", "danger");
                return;
            }

            // Show loading state
            if (loginBtn) {
                loginBtn.disabled = true;
            }
            if (loginText) {
                loginText.textContent = "Logging in...";
            }
            if (loginSpinner) {
                loginSpinner.style.display = "inline-block";
            }
            if (messageDiv) {
                messageDiv.innerHTML = "";
            }

            try {
                console.log("Attempting login with email:", email);

                // Try both endpoints for compatibility
                let loginUrl = "/odata/SystemAccounts/login";
                let response = await fetch(loginUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                // If Auth endpoint fails, try SystemAccount endpoint as fallback
                if (!response.ok && response.status === 404) {
                    console.log("Auth endpoint not found, trying SystemAccount endpoint...");
                    loginUrl = "/odata/SystemAccounts/login";
                    response = await fetch(loginUrl, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    });
                }

                console.log("Using endpoint:", loginUrl);
                console.log("Response status:", response.status);
                console.log("Response headers:", response.headers.get('content-type'));

                // First get the response as text
                const responseText = await response.text();
                console.log("Raw response:", responseText);

                if (response.ok) {
                    // Try to parse as JSON
                    let result;
                    try {
                        if (responseText) {
                            result = JSON.parse(responseText);
                        } else {
                            throw new Error("Empty response");
                        }
                    } catch (parseError) {
                        console.error("JSON parse error:", parseError);
                        showMessage("Server response error: Invalid JSON", "danger");
                        return;
                    }

                    console.log("Login successful:", result);

                    if (result && result.token) {
                        // Save token
                        localStorage.setItem("token", result.token);

                        // Show success message
                        showMessage("Login successful! Redirecting...", "success");

                        // Redirect based on role
                        setTimeout(function () {
                            redirectByRole(result.role || 0);
                        }, 1500);
                    } else {
                        showMessage("Login failed: No token received", "danger");
                    }
                } else {
                    // Handle error response
                    let errorMessage = "Login failed";

                    if (responseText) {
                        // Try to parse error as JSON first
                        try {
                            const errorData = JSON.parse(responseText);
                            errorMessage = errorData.message || errorData.title || errorData.error || responseText;
                        } catch (parseError) {
                            // If not JSON, use the text directly
                            errorMessage = responseText;
                        }
                    } else {
                        errorMessage = "HTTP " + response.status + ": " + response.statusText;
                    }

                    console.log("Login failed:", errorMessage);
                    showMessage(errorMessage, "danger");
                }
            } catch (error) {
                console.error("Login error:", error);
                let errorMsg = "Network error";

                if (error.name === 'TypeError' && error.message.includes('fetch')) {
                    errorMsg = "Cannot connect to server. Please check if the server is running.";
                } else if (error.message) {
                    errorMsg = "Error: " + error.message;
                }

                showMessage(errorMsg, "danger");
            } finally {
                // Reset button state
                if (loginBtn) {
                    loginBtn.disabled = false;
                }
                if (loginText) {
                    loginText.textContent = "Login";
                }
                if (loginSpinner) {
                    loginSpinner.style.display = "none";
                }
            }
        }

        function redirectByRole(role) {
            console.log("Redirecting user with role:", role);

            try {
                if (role === 0) {
                    window.location.href = "/dashboard.html";
                } else if (role === 1) {
                    window.location.href = "/staff.html";
                } else if (role === 2) {
                    window.location.href = "/lecturer.html";
                } else {
                    console.warn("Unknown role:", role);
                    window.location.href = "/dashboard.html";
                }
            } catch (error) {
                console.error("Redirect error:", error);
                window.location.href = "/dashboard.html";
            }
        }

        function showMessage(message, type) {
            const messageDiv = document.getElementById("message");
            if (messageDiv) {
                messageDiv.innerHTML = '<div class="alert alert-' + type + '">' +
                    (message || "An error occurred") + '</div>';
            }
        }

        // Check if user is already logged in
        window.addEventListener('load', function () {
            try {
                const token = localStorage.getItem('token');
                if (token) {
                    showMessage("Checking existing session...", "info");

                    // Try Auth/me first, then SystemAccount/me as fallback
                    validateToken('/odata/SystemAccounts/me')
                        .catch(function () {
                            return validateToken('/odata/SystemAccounts/me');
                        })
                        .then(function (user) {
                            console.log("Token validation successful:", user);
                            showMessage("Already logged in. Redirecting...", "success");
                            setTimeout(function () {
                                redirectByRole(user.Role || 0);
                            }, 1000);
                        })
                        .catch(function (error) {
                            console.log("Token validation failed:", error.message);
                            localStorage.removeItem('token');
                            // Clear any existing messages
                            const messageDiv = document.getElementById("message");
                            if (messageDiv) {
                                messageDiv.innerHTML = "";
                            }
                        });
                }
            } catch (error) {
                console.error("Load error:", error);
                localStorage.removeItem('token');
            }
        });

        function validateToken(endpoint) {
            const token = localStorage.getItem('token');
            return fetch(endpoint, {
                headers: { 'Authorization': 'Bearer ' + token }
            })
                .then(function (response) {
                    console.log("Token validation response status:", response.status, "for", endpoint);

                    if (response.ok) {
                        return response.text().then(function (text) {
                            if (text) {
                                try {
                                    return JSON.parse(text);
                                } catch (e) {
                                    throw new Error('Invalid JSON response from ' + endpoint);
                                }
                            } else {
                                throw new Error('Empty response from ' + endpoint);
                            }
                        });
                    } else {
                        throw new Error('Token invalid - Status: ' + response.status + ' from ' + endpoint);
                    }
                });
        }

        // Simple test function
        function testConnection() {
            console.log("Testing API connection...");
            fetch('/odata/SystemAccounts/me')
                .then(function (response) {
                    console.log('Connection test - Status:', response.status);
                    console.log('Connection test - Content-Type:', response.headers.get('content-type'));
                    return response.text();
                })
                .then(function (text) {
                    console.log('Connection test - Response text:', text);
                    if (text) {
                        try {
                            const json = JSON.parse(text);
                            console.log('Connection test - Parsed JSON:', json);
                        } catch (e) {
                            console.log('Connection test - Not JSON, raw text:', text);
                        }
                    }
                })
                .catch(function (error) {
                    console.log('Connection test - Error:', error);
                });
        }

        // Add a simple test button for debugging
        function addTestButton() {
            const messageDiv = document.getElementById("message");
            if (messageDiv) {
                const testBtn = document.createElement('button');
                testBtn.textContent = 'Test API Connection';
                testBtn.className = 'btn btn-sm btn-outline-secondary mt-2';
                testBtn.onclick = testConnection;
                messageDiv.appendChild(testBtn);
            }
        }

        // Uncomment the line below to add test button
        // setTimeout(addTestButton, 1000);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
