<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h2>Dashboard</h2>
        <p>Welcome to the FU News Management System!</p>

        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5>Admin Panel</h5>
                        <p>Manage system accounts</p>
                        <a href="admin.html" class="btn btn-danger">Go to Admin</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5>Staff Panel</h5>
                        <p>Manage news and categories</p>
                        <a href="staff.html" class="btn btn-primary">Go to Staff</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5>Lecturer Panel</h5>
                        <p>View and search news</p>
                        <a href="lecturer.html" class="btn btn-success">Go to Lecturer</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
    </div>

    <script>
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                window.location.href = '/login.html';
            }
        }
    </script>
</body>
</html>
