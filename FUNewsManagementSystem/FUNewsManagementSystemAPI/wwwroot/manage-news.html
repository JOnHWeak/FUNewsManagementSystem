<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --danger-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --card-shadow: 0 10px 25px rgba(0,0,0,0.1);
            --hover-transform: translateY(-2px);
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-header {
            background: var(--primary-gradient);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
            box-shadow: var(--card-shadow);
        }

            .main-header h1 {
                margin: 0;
                font-weight: 300;
                letter-spacing: 1px;
            }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            overflow: hidden;
        }

            .card:hover {
                transform: var(--hover-transform);
                box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            }

        .card-header {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 1.5rem;
            font-weight: 500;
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

            .form-control:focus, .form-select:focus {
                border-color: #667eea;
                box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            }

        .btn {
            border-radius: 25px;
            padding: 0.75rem 2rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--primary-gradient);
            border: none;
        }

            .btn-primary:hover {
                transform: var(--hover-transform);
                box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            }

        .btn-success {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
            border: none;
        }

        .btn-danger {
            background: var(--danger-gradient);
            border: none;
        }

        .btn-outline-primary {
            border: 2px solid #667eea;
            color: #667eea;
        }

            .btn-outline-primary:hover {
                background: var(--primary-gradient);
                border-color: transparent;
            }

        .article-card {
            transition: all 0.3s ease;
        }

            .article-card:hover {
                transform: var(--hover-transform);
            }

        .badge {
            border-radius: 20px;
            padding: 0.5rem 1rem;
            font-weight: 500;
        }

        .loading-spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

            .action-buttons .btn {
                padding: 0.5rem;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

        .debug-panel {
            background: #1a1a1a;
            color: #00ff00;
            border-radius: 10px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
        }

        .toast {
            border-radius: 15px;
            box-shadow: var(--card-shadow);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="main-header">
        <div class="container">
            <h1><i class="fas fa-newspaper me-3"></i>News Management System</h1>
            <p class="mb-0 opacity-75">Create, manage, and publish your news articles</p>
        </div>
    </div>

    <div class="container">
        <!-- Create/Edit News Form -->
        <div class="card mb-4 fade-in">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div>
                    <i class="fas fa-plus-circle me-2"></i>
                    <span id="formTitle">Add New Article</span>
                </div>
                <button type="button" class="btn btn-outline-light btn-sm" onclick="resetForm()" id="resetBtn" style="display: none;">
                    <i class="fas fa-plus"></i> Add New
                </button>
            </div>
            <div class="card-body">
                <form id="articleForm">
                    <input type="hidden" id="articleId" value="">
                    <input type="hidden" id="isEditing" value="false">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="title" class="form-label">
                                <i class="fas fa-heading text-primary me-1"></i>Title <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="title" placeholder="Enter article title" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="headline" class="form-label">
                                <i class="fas fa-quote-left text-primary me-1"></i>Headline <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="headline" placeholder="Enter article headline" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="content" class="form-label">
                            <i class="fas fa-file-alt text-primary me-1"></i>Content <span class="text-danger">*</span>
                        </label>
                        <textarea class="form-control" id="content" rows="4" placeholder="Enter article content" required></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="source" class="form-label">
                                <i class="fas fa-link text-primary me-1"></i>Source
                            </label>
                            <input type="text" class="form-control" id="source" placeholder="News source">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="categoryId" class="form-label">
                                <i class="fas fa-tags text-primary me-1"></i>Category
                            </label>
                            <select class="form-select" id="categoryId">
                                <option value="">No Category</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="isPublished" checked>
                            <label class="form-check-label" for="isPublished">
                                <i class="fas fa-eye text-success me-1"></i>Published
                            </label>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-primary" onclick="saveArticle()" id="saveBtn">
                            <i class="fas fa-save me-1"></i>
                            <span id="saveBtnText">Add Article</span>
                        </button>
                        <button type="button" class="btn btn-outline-secondary" onclick="resetForm()" id="cancelBtn" style="display: none;">
                            <i class="fas fa-times me-1"></i>Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- News List -->
        <div class="card fade-in">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div>
                    <i class="fas fa-list me-2"></i>Articles List
                </div>
                <button class="btn btn-outline-light btn-sm" onclick="loadNews()">
                    <i class="fas fa-sync-alt me-1"></i>Refresh
                </button>
            </div>
            <div class="card-body">
                <div id="newsList">
                    <div class="text-center py-4">
                        <i class="fas fa-mouse-pointer text-muted mb-2" style="font-size: 2rem;"></i>
                        <p class="text-muted">Click Refresh to load articles</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Debug Panel (Optional) -->
        <div class="card mt-4" id="debugCard" style="display: none;">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div>
                    <i class="fas fa-bug me-2"></i>Debug Console
                </div>
                <button class="btn btn-outline-light btn-sm" onclick="clearDebugLog()">
                    <i class="fas fa-trash me-1"></i>Clear
                </button>
            </div>
            <div class="card-body p-0">
                <div id="debugLog" class="debug-panel p-3"></div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="responseToast" class="toast" role="alert">
            <div class="toast-header">
                <i class="fas fa-bell text-primary me-2"></i>
                <strong class="me-auto" id="toastTitle">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastBody"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('token');
        let isDebugMode = false; // Set to true to enable debug mode

        // Show/hide debug panel
        if (isDebugMode) {
            document.getElementById('debugCard').style.display = 'block';
        }

        function debugLog(message) {
            if (!isDebugMode) return;

            const log = document.getElementById('debugLog');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<span style="color: #888;">[${timestamp}]</span> ${message}`;
            log.appendChild(logEntry);
            log.scrollTop = log.scrollHeight;

            // Also log to console
            console.log(message);
        }

        function clearDebugLog() {
            document.getElementById('debugLog').innerHTML = '';
        }

        function showToast(title, message, isSuccess = true) {
            const toast = new bootstrap.Toast(document.getElementById('responseToast'));
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastBody').textContent = message;

            const toastElement = document.getElementById('responseToast');
            toastElement.className = `toast ${isSuccess ? 'bg-success' : 'bg-danger'} text-white`;

            toast.show();
        }

        function getCurrentUserId() {
            try {
                const token = localStorage.getItem('token');
                if (!token) return null;

                const payload = JSON.parse(atob(token.split('.')[1]));
                debugLog('Token payload: ' + JSON.stringify(payload));

                const userId = payload.NameID ||
                    payload.nameid ||
                    payload['http://schemas.xmlsoap.org/ws/2005/05/identity/claims/nameidentifier'] ||
                    payload.sub ||
                    payload.id;

                if (userId && userId !== 'admin') {
                    return parseInt(userId);
                }

                return null;
            } catch (error) {
                debugLog(`Error getting user ID: ${error.message}`);
                return null;
            }
        }

        async function loadCategories() {
            debugLog('Loading categories...');
            try {
                const response = await fetch('/odata/Categories', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.ok) {
                    const data = await response.json();
                    const select = document.getElementById('categoryId');

                    // Clear existing options except first
                    select.innerHTML = '<option value="">No Category</option>';

                    if (data.value) {
                        data.value.forEach(category => {
                            const option = document.createElement('option');
                            option.value = category.CategoryId;
                            option.textContent = category.CategoryName;
                            select.appendChild(option);
                        });
                        debugLog(`Loaded ${data.value.length} categories`);
                    }
                } else {
                    debugLog(`Categories error: ${response.status}`);
                }
            } catch (error) {
                debugLog(`Categories network error: ${error.message}`);
            }
        }

        function resetForm() {
            document.getElementById('articleForm').reset();
            document.getElementById('articleId').value = '';
            document.getElementById('isEditing').value = 'false';
            document.getElementById('isPublished').checked = true;

            // Update UI
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle me-2"></i>Add New Article';
            document.getElementById('saveBtnText').textContent = 'Add Article';
            document.getElementById('resetBtn').style.display = 'none';
            document.getElementById('cancelBtn').style.display = 'none';

            debugLog('Form reset to add mode');
        }

        function editArticle(articleId) {
            debugLog(`Starting edit for article: ${articleId}`);
            fetchArticleForEdit(articleId);
        }

        async function fetchArticleForEdit(articleId) {
            try {
                debugLog(`Fetching article data for edit: ${articleId}`);

                const response = await fetch(`/odata/NewsArticles('${articleId}')`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.ok) {
                    const article = await response.json();
                    populateFormForEdit(article);
                } else {
                    const errorText = await response.text();
                    debugLog(`Error fetching article: ${errorText}`);
                    showToast('Error', 'Failed to load article for editing', false);
                }
            } catch (error) {
                debugLog(`Network error fetching article: ${error.message}`);
                showToast('Error', 'Network error loading article', false);
            }
        }

        function populateFormForEdit(article) {
            debugLog(`Populating form with article data`);

            document.getElementById('articleId').value = article.NewsArticleId;
            document.getElementById('isEditing').value = 'true';
            document.getElementById('title').value = article.NewsTitle || '';
            document.getElementById('headline').value = article.Headline || '';
            document.getElementById('content').value = article.NewsContent || '';
            document.getElementById('source').value = article.NewsSource || '';
            document.getElementById('categoryId').value = article.CategoryId || '';
            document.getElementById('isPublished').checked = article.NewsStatus || false;

            // Update UI
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit me-2"></i>Edit Article';
            document.getElementById('saveBtnText').textContent = 'Update Article';
            document.getElementById('resetBtn').style.display = 'inline-block';
            document.getElementById('cancelBtn').style.display = 'inline-block';

            // Scroll to form
            document.querySelector('.card').scrollIntoView({ behavior: 'smooth' });

            debugLog('Form populated for editing');
        }

        async function saveArticle() {
            const isEditing = document.getElementById('isEditing').value === 'true';
            const articleId = document.getElementById('articleId').value;

            debugLog(`Saving article - Edit mode: ${isEditing}, ID: ${articleId}`);

            const title = document.getElementById('title').value.trim();
            const headline = document.getElementById('headline').value.trim();
            const content = document.getElementById('content').value.trim();
            const source = document.getElementById('source').value.trim();
            const categoryId = document.getElementById('categoryId').value;
            const isPublished = document.getElementById('isPublished').checked;

            if (!title || !headline || !content) {
                showToast('Validation Error', 'Please fill in Title, Headline, and Content', false);
                return;
            }

            const article = {
                NewsTitle: title,
                Headline: headline,
                NewsContent: content,
                NewsSource: source || null,
                CategoryId: (categoryId && categoryId !== '') ? parseInt(categoryId) : null,
                NewsStatus: isPublished,
                UpdatedById: getCurrentUserId()
            };

            if (article.CategoryId === null) {
                delete article.CategoryId;
            }

            if (isEditing) {
                await updateArticle(articleId, article);
            } else {
                article.NewsArticleId = 'news_' + Date.now();
                article.CreatedDate = new Date().toISOString();
                article.CreatedById = getCurrentUserId();
                await createArticle(article);
            }
        }

        async function createArticle(article) {
            debugLog('Creating new article...');

            try {
                const response = await fetch('/odata/NewsArticles', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(article)
                });

                const responseText = await response.text();
                debugLog(`Create response: ${response.status} - ${responseText}`);

                if (response.ok) {
                    showToast('Success', 'Article created successfully!');
                    resetForm();
                    loadNews();
                } else {
                    let errorMsg = 'Error creating article';
                    try {
                        const errorData = JSON.parse(responseText);
                        if (errorData.error?.message) {
                            errorMsg = errorData.error.message;
                        } else if (errorData.message) {
                            errorMsg = errorData.message;
                        }
                    } catch (e) {
                        errorMsg = responseText;
                    }
                    showToast('Error', errorMsg, false);
                }
            } catch (error) {
                debugLog(`Create network error: ${error.message}`);
                showToast('Error', 'Network error: ' + error.message, false);
            }
        }

        async function updateArticle(articleId, article) {
            debugLog(`Updating article ${articleId}...`);

            try {
                // Create complete article object with all required fields
                const updatePayload = {
                    NewsArticleId: articleId,
                    NewsTitle: article.NewsTitle,
                    Headline: article.Headline,
                    NewsContent: article.NewsContent,
                    NewsSource: article.NewsSource,
                    NewsStatus: article.NewsStatus,
                    ModifiedDate: new Date().toISOString(),
                    UpdatedById: article.UpdatedById
                };

                // Add CategoryId only if it exists
                if (article.CategoryId) {
                    updatePayload.CategoryId = article.CategoryId;
                }

                debugLog(`Update payload: ${JSON.stringify(updatePayload, null, 2)}`);

                const response = await fetch(`/odata/NewsArticles('${articleId}')`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(updatePayload)
                });

                debugLog(`Update response status: ${response.status}`);
                debugLog(`Update response headers: ${JSON.stringify(Object.fromEntries(response.headers.entries()))}`);

                const responseText = await response.text();
                debugLog(`Update response body: ${responseText}`);

                if (response.ok || response.status === 204) {
                    showToast('Success', 'Article updated successfully!');
                    resetForm();
                    loadNews();
                } else {
                    let errorMsg = 'Error updating article';
                    try {
                        const errorData = JSON.parse(responseText);
                        if (errorData.error?.message) {
                            errorMsg = errorData.error.message;
                        } else if (errorData.message) {
                            errorMsg = errorData.message;
                        } else if (errorData.title) {
                            errorMsg = errorData.title;
                        }

                        // Check for validation errors
                        if (errorData.errors) {
                            const validationErrors = Object.entries(errorData.errors)
                                .map(([field, errors]) => `${field}: ${errors.join(', ')}`)
                                .join('; ');
                            errorMsg += ` - ${validationErrors}`;
                        }
                    } catch (e) {
                        errorMsg = responseText || `HTTP ${response.status}`;
                    }
                    showToast('Error', errorMsg, false);
                    debugLog(`Update error details: ${errorMsg}`);
                }
            } catch (error) {
                debugLog(`Update network error: ${error.message}`);
                showToast('Error', 'Network error: ' + error.message, false);
            }
        }

        async function loadNews() {
            debugLog('Loading news articles...');
            const container = document.getElementById('newsList');
            container.innerHTML = `
                    <div class="text-center py-4">
                        <div class="loading-spinner mb-3"></div>
                        <p class="text-muted">Loading articles...</p>
                    </div>
                `;

            try {
                const response = await fetch('/odata/NewsArticles?$expand=Category&$orderby=CreatedDate desc', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.ok) {
                    const responseText = await response.text();
                    const data = JSON.parse(responseText);
                    const articles = data.value || data || [];

                    debugLog(`Loaded ${articles.length} articles`);

                    if (articles.length > 0) {
                        container.innerHTML = '';

                        articles.forEach((article, index) => {
                            const div = document.createElement('div');
                            div.className = 'card mb-3 article-card fade-in';
                            div.style.animationDelay = `${index * 0.1}s`;

                            const title = article.NewsTitle || 'No Title';
                            const headline = article.Headline || 'No Headline';
                            const content = article.NewsContent || 'No Content';
                            const source = article.NewsSource || 'Unknown Source';
                            const categoryName = article.Category ? article.Category.CategoryName : 'Uncategorized';
                            const createdDate = article.CreatedDate ? new Date(article.CreatedDate).toLocaleDateString() : 'Unknown Date';
                            const modifiedDate = article.ModifiedDate ? new Date(article.ModifiedDate).toLocaleDateString() : null;
                            const status = article.NewsStatus ? 'Published' : 'Draft';

                            div.innerHTML = `
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-start">
                                            <div class="flex-grow-1">
                                                <h5 class="card-title text-primary mb-2">
                                                    <i class="fas fa-newspaper me-2"></i>${title}
                                                </h5>
                                                <h6 class="card-subtitle mb-3 text-muted">${headline}</h6>
                                                <p class="card-text mb-3">${content.length > 200 ? content.substring(0, 200) + '...' : content}</p>
                                                <div class="d-flex flex-wrap gap-2 mb-3">
                                                    <span class="badge bg-primary">
                                                        <i class="fas fa-tag me-1"></i>${categoryName}
                                                    </span>
                                                    <span class="badge ${article.NewsStatus ? 'bg-success' : 'bg-warning text-dark'}">
                                                        <i class="fas ${article.NewsStatus ? 'fa-eye' : 'fa-eye-slash'} me-1"></i>${status}
                                                    </span>
                                                    <span class="badge bg-info">
                                                        <i class="fas fa-link me-1"></i>${source}
                                                    </span>
                                                </div>
                                            </div>
                                            <div class="ms-3">
                                                <div class="action-buttons">
                                                    <button class="btn btn-outline-primary btn-sm" onclick="editArticle('${article.NewsArticleId}')" title="Edit Article">
                                                        <i class="fas fa-edit"></i>
                                                    </button>
                                                    <button class="btn btn-outline-danger btn-sm" onclick="deleteNews('${article.NewsArticleId}')" title="Delete Article">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                        <hr>
                                        <div class="text-muted small">
                                            <div class="row">
                                                <div class="col-md-6">
                                                    <i class="fas fa-calendar me-1"></i>Created: ${createdDate}
                                                    ${modifiedDate ? `<br><i class="fas fa-edit me-1"></i>Modified: ${modifiedDate}` : ''}
                                                </div>
                                                <div class="col-md-6 text-md-end">
                                                    <i class="fas fa-fingerprint me-1"></i>ID: ${article.NewsArticleId}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            container.appendChild(div);
                        });

                        debugLog(`Successfully displayed ${articles.length} articles`);
                    } else {
                        container.innerHTML = `
                                <div class="text-center py-5">
                                    <i class="fas fa-newspaper text-muted mb-3" style="font-size: 3rem;"></i>
                                    <h5 class="text-muted">No articles found</h5>
                                    <p class="text-muted">Create your first article to get started!</p>
                                </div>
                            `;
                    }
                } else {
                    const errorText = await response.text();
                    debugLog(`Load error: ${errorText}`);
                    container.innerHTML = `
                            <div class="alert alert-danger">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                Error loading articles: ${response.status}
                            </div>
                        `;
                }
            } catch (error) {
                debugLog(`Load network error: ${error.message}`);
                container.innerHTML = `
                        <div class="alert alert-danger">
                            <i class="fas fa-wifi me-2"></i>
                            Network error: ${error.message}
                        </div>
                    `;
            }
        }

        async function deleteNews(id) {
            if (!confirm('Are you sure you want to delete this article? This action cannot be undone.')) return;

            debugLog(`Deleting article: ${id}`);

            try {
                const response = await fetch(`/odata/NewsArticles('${id}')`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.ok) {
                    showToast('Success', 'Article deleted successfully!');
                    loadNews();

                    // If we're currently editing this article, reset the form
                    if (document.getElementById('articleId').value === id) {
                        resetForm();
                    }
                } else {
                    const errorText = await response.text();
                    debugLog(`Delete error: ${errorText}`);
                    showToast('Error', 'Error deleting article', false);
                }
            } catch (error) {
                debugLog(`Delete network error: ${error.message}`);
                showToast('Error', 'Network error', false);
            }
        }

        // Initialize
        if (!token) {
            document.getElementById('newsList').innerHTML = `
                    <div class="alert alert-warning text-center">
                        <i class="fas fa-lock me-2"></i>
                        Please <a href="/login.html" class="alert-link">login</a> first to access the news management system.
                    </div>
                `;
            debugLog('No authentication token found');
        } else {
            debugLog('Token found, initializing...');
            loadCategories();
            loadNews();
            debugLog('Page initialized successfully');
        }

        // Add some smooth animations on load
        document.addEventListener('DOMContentLoaded', function () {
            const cards = document.querySelectorAll('.fade-in');
            cards.forEach((card, index) => {
                card.style.animationDelay = `${index * 0.2}s`;
            });
        });
    </script>
</body>
</html>
