<!DOCTYPE html>
<html>
<head>
    <title>News Management (Debug Version)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h2>News Management (Debug)</h2>


        <!-- Create News Form -->
        <div class="card mb-4">
            <div class="card-header">Add New Article</div>
            <div class="card-body">
                <div class="mb-3">
                    <label>Title</label>
                    <input type="text" class="form-control" id="title" placeholder="Article Title" value="Test Article">
                </div>
                <div class="mb-3">
                    <label>Headline</label>
                    <input type="text" class="form-control" id="headline" placeholder="Article Headline" value="Test Headline">
                </div>
                <div class="mb-3">
                    <label>Content</label>
                    <textarea class="form-control" id="content" rows="3" placeholder="Article Content">Test content for this article</textarea>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <label>Source</label>
                        <input type="text" class="form-control" id="source" placeholder="News Source" value="Test Source">
                    </div>
                    <div class="col-md-6">
                        <label>Category</label>
                        <select class="form-select" id="categoryId">
                            <option value="">No Category</option>
                        </select>
                    </div>
                </div>
                <div class="mt-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="isPublished" checked>
                        <label class="form-check-label">Published</label>
                    </div>
                </div>
                <button class="btn btn-primary mt-2" onclick="createNews()">Add Article</button>
            </div>
        </div>

        <!-- News List -->
        <div class="card">
            <div class="card-header">
                Articles List
                <button class="btn btn-sm btn-secondary float-end" onclick="loadNews()">Refresh</button>
            </div>
            <div class="card-body">
                <div id="newsList">Click Refresh to load articles</div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');

        function debugLog(message) {
            const log = document.getElementById('debugLog');
            const timestamp = new Date().toLocaleTimeString();
        }

        function clearDebugLog() {
            document.getElementById('debugLog').innerHTML = '';
        }

        // Get current user ID from token (optional)
        function getCurrentUserId() {
            try {
                const token = localStorage.getItem('token');
                if (!token) return null;

                // Decode JWT payload
                const payload = JSON.parse(atob(token.split('.')[1]));
                console.log('Token payload:', payload); // Debug log

                // Get user ID from different possible claim names
                const userId = payload.NameID ||
                    payload.nameid ||
                    payload['http://schemas.xmlsoap.org/ws/2005/05/identity/claims/nameidentifier'] ||
                    payload.sub ||
                    payload.id;

                if (userId && userId !== 'admin') {
                    return parseInt(userId);
                }

                return null; // Return null for admin or if no valid ID found
            } catch (error) {
                console.error(`Error getting user ID: ${error.message}`);
                return null;
            }
        }

        // Test OData endpoint
        async function testODataEndpoint() {
            debugLog('=== Testing OData Endpoint ===');

            try {
                // Test basic GET
                debugLog('Testing GET /odata/NewsArticles');
                const response = await fetch('/odata/NewsArticles', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                debugLog(`Response status: ${response.status}`);
                debugLog(`Content-Type: ${response.headers.get('content-type')}`);

                const text = await response.text();
                debugLog(`Response length: ${text.length} chars`);
                debugLog(`Response preview: ${text.substring(0, 200)}...`);

                if (response.ok) {
                    try {
                        const data = JSON.parse(text);
                        debugLog(`Parsed successfully. Found ${data.value ? data.value.length : 0} items`);
                    } catch (e) {
                        debugLog(`JSON parse error: ${e.message}`);
                    }
                } else {
                    debugLog(`Error response: ${text}`);
                }
            } catch (error) {
                debugLog(`Network error: ${error.message}`);
            }
        }

        // Test load response in detail
        async function testLoadResponse() {
            debugLog('=== Testing Load Response Detail ===');

            try {
                const response = await fetch('/odata/NewsArticles', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                debugLog(`Status: ${response.status} ${response.statusText}`);
                debugLog(`Headers: ${JSON.stringify(Object.fromEntries(response.headers.entries()), null, 2)}`);

                const responseText = await response.text();
                debugLog(`Full Response Text:\n${responseText}`);

                try {
                    const data = JSON.parse(responseText);
                    debugLog(`Parsed JSON:\n${JSON.stringify(data, null, 2)}`);

                    if (data.value) {
                        debugLog(`Articles array length: ${data.value.length}`);
                        data.value.forEach((article, i) => {
                            debugLog(`Article ${i}:\n${JSON.stringify(article, null, 2)}`);
                        });
                    } else {
                        debugLog('No "value" property found in response');
                    }
                } catch (e) {
                    debugLog(`JSON Parse Error: ${e.message}`);
                }

            } catch (error) {
                debugLog(`Network Error: ${error.message}`);
            }
        }
        async function testCreateMinimal() {
            debugLog('=== Testing Minimal Create ===');

            const minimalArticle = {
                NewsArticleId: 'test_' + Date.now(),
                NewsTitle: 'Minimal Test',
                Headline: 'Test Headline'
            };

            debugLog(`Sending: ${JSON.stringify(minimalArticle, null, 2)}`);

            try {
                const response = await fetch('/odata/NewsArticles', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(minimalArticle)
                });

                debugLog(`Response status: ${response.status}`);
                const responseText = await response.text();
                debugLog(`Response: ${responseText}`);

                if (response.ok) {
                    debugLog('✅ Minimal create successful!');
                } else {
                    debugLog('❌ Minimal create failed');
                }
            } catch (error) {
                debugLog(`❌ Network error: ${error.message}`);
            }
        }

        // Load categories for dropdown
        async function loadCategories() {
            debugLog('Loading categories...');
            try {
                const response = await fetch('/odata/Categories', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.ok) {
                    const data = await response.json();
                    const select = document.getElementById('categoryId');

                    debugLog(`Found ${data.value ? data.value.length : 0} categories`);

                    if (data.value) {
                        data.value.forEach(category => {
                            const option = document.createElement('option');
                            option.value = category.CategoryId;
                            option.textContent = category.CategoryName;
                            select.appendChild(option);
                        });
                    }
                } else {
                    debugLog(`Categories error: ${response.status}`);
                }
            } catch (error) {
                debugLog(`Categories network error: ${error.message}`);
            }
        }

        // Create new article
        async function createNews() {
            debugLog('=== Creating News Article ===');

            const title = document.getElementById('title').value;
            const headline = document.getElementById('headline').value;
            const content = document.getElementById('content').value;
            const source = document.getElementById('source').value;
            const categoryId = document.getElementById('categoryId').value;
            const isPublished = document.getElementById('isPublished').checked;

            if (!title || !headline || !content) {
                alert('Please fill in Title, Headline, and Content');
                return;
            }

            const article = {
                NewsArticleId: 'news_' + Date.now(),
                NewsTitle: title,
                Headline: headline,
                NewsContent: content,
                NewsSource: source || null,
                CategoryId: (categoryId && categoryId !== '') ? parseInt(categoryId) : null,
                NewsStatus: isPublished,
                CreatedDate: new Date().toISOString(),
                CreatedById: getCurrentUserId(),
                UpdatedById: getCurrentUserId()
            };

            // Remove null CategoryId
            if (article.CategoryId === null) {
                delete article.CategoryId;
            }

            debugLog(`Article data: ${JSON.stringify(article, null, 2)}`);

            try {
                debugLog('Sending POST request...');
                const response = await fetch('/odata/NewsArticles', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(article)
                });

                debugLog(`Response status: ${response.status} ${response.statusText}`);
                debugLog(`Response headers: ${JSON.stringify(Object.fromEntries(response.headers.entries()))}`);

                const responseText = await response.text();
                debugLog(`Response body: ${responseText}`);

                if (response.ok) {
                    debugLog('✅ Article created successfully!');
                    alert('Article created successfully!');

                    // Clear form
                    document.getElementById('title').value = '';
                    document.getElementById('headline').value = '';
                    document.getElementById('content').value = '';
                    document.getElementById('source').value = '';
                    document.getElementById('categoryId').value = '';
                    document.getElementById('isPublished').checked = true;

                    // Reload list
                    loadNews();
                } else {
                    debugLog('❌ Article creation failed');
                    let errorMsg = 'Error creating article';
                    try {
                        const errorData = JSON.parse(responseText);
                        if (errorData.error && errorData.error.message) {
                            errorMsg = errorData.error.message;
                        } else if (errorData.message) {
                            errorMsg = errorData.message;
                        }
                        debugLog(`Parsed error: ${errorMsg}`);
                    } catch (e) {
                        errorMsg = responseText;
                        debugLog(`Raw error: ${errorMsg}`);
                    }
                    alert('Error: ' + errorMsg);
                }
            } catch (error) {
                debugLog(`❌ Network error: ${error.message}`);
                alert('Error: ' + error.message);
            }
        }

        // Load and display articles
        async function loadNews() {
            debugLog('Loading news articles...');
            const container = document.getElementById('newsList');
            container.innerHTML = 'Loading...';

            try {
                // Try with $expand to get related data
                const response = await fetch('/odata/NewsArticles?$expand=Category', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                debugLog(`Load news response: ${response.status}`);

                if (response.ok) {
                    const responseText = await response.text();
                    debugLog(`Response text length: ${responseText.length}`);
                    debugLog(`Response preview: ${responseText.substring(0, 500)}...`);

                    try {
                        const data = JSON.parse(responseText);
                        debugLog(`Parsed data structure: ${JSON.stringify(data, null, 2).substring(0, 800)}...`);

                        const articles = data.value || data || [];
                        debugLog(`Found ${articles.length} articles`);

                        if (articles.length > 0) {
                            container.innerHTML = '';

                            articles.forEach((article, index) => {
                                debugLog(`Processing article ${index}: ID=${article.NewsArticleId}, Title=${article.NewsTitle}`);

                                const div = document.createElement('div');
                                div.className = 'card mb-2';

                                // Safe access to properties
                                const title = article.NewsTitle || 'No Title';
                                const headline = article.Headline || 'No Headline';
                                const content = article.NewsContent || 'No Content';
                                const source = article.NewsSource || 'No Source';
                                const categoryName = article.Category ? article.Category.CategoryName : 'No Category';
                                const createdDate = article.CreatedDate ? new Date(article.CreatedDate).toLocaleDateString() : 'Unknown Date';
                                const status = article.NewsStatus ? 'Published' : 'Draft';

                                div.innerHTML = `
                                        <div class="card-body">
                                            <div class="d-flex justify-content-between align-items-start">
                                                <div class="flex-grow-1">
                                                    <h6 class="card-title">${title}</h6>
                                                    <p class="text-muted small mb-1">${headline}</p>
                                                    <p class="small mb-2">${content.length > 100 ? content.substring(0, 100) + '...' : content}</p>
                                                    <div class="d-flex flex-wrap gap-2">
                                                        <span class="badge bg-info">${categoryName}</span>
                                                        <span class="badge ${article.NewsStatus ? 'bg-success' : 'bg-warning'}">${status}</span>
                                                        <small class="text-muted">Source: ${source}</small>
                                                    </div>
                                                </div>
                                                <div class="ms-3">
                                                    <button class="btn btn-sm btn-danger" onclick="deleteNews('${article.NewsArticleId}')">Delete</button>
                                                </div>
                                            </div>
                                            <div class="mt-2 pt-2 border-top">
                                                <small class="text-muted">
                                                    ID: ${article.NewsArticleId} | Created: ${createdDate}
                                                </small>
                                            </div>
                                        </div>
                                    `;
                                container.appendChild(div);
                            });

                            debugLog(`✅ Successfully displayed ${articles.length} articles`);
                        } else {
                            container.innerHTML = '<div class="alert alert-info">No articles found</div>';
                            debugLog('No articles to display');
                        }
                    } catch (parseError) {
                        debugLog(`❌ JSON parse error: ${parseError.message}`);
                        debugLog(`Raw response: ${responseText}`);
                        container.innerHTML = '<div class="alert alert-danger">Error parsing response. Check debug log.</div>';
                    }
                } else {
                    const errorText = await response.text();
                    debugLog(`❌ Load error: ${errorText}`);
                    container.innerHTML = '<div class="alert alert-danger">Error loading articles: ' + response.status + '</div>';
                }
            } catch (error) {
                debugLog(`❌ Load network error: ${error.message}`);
                container.innerHTML = '<div class="alert alert-danger">Network error: ' + error.message + '</div>';
            }
        }

        // Delete article
        async function deleteNews(id) {
            if (!confirm('Delete this article?')) return;

            debugLog(`Deleting article: ${id}`);

            try {
                const response = await fetch(`/odata/NewsArticles('${id}')`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                debugLog(`Delete response: ${response.status}`);

                if (response.ok) {
                    debugLog('✅ Article deleted successfully');
                    alert('Article deleted!');
                    loadNews();
                } else {
                    const errorText = await response.text();
                    debugLog(`❌ Delete error: ${errorText}`);
                    alert('Error deleting article: ' + errorText);
                }
            } catch (error) {
                debugLog(`❌ Delete network error: ${error.message}`);
                alert('Error: ' + error.message);
            }
        }

        // Initialize
        if (!token) {
            document.getElementById('newsList').innerHTML =
                '<p class="text-danger">Please <a href="/login.html">login</a> first</p>';
            debugLog('❌ No authentication token found');
        } else {
            debugLog('✅ Token found, initializing...');
            loadCategories();
            debugLog('Page initialized');
        }
    </script>
</body>
</html>
