<!DOCTYPE html>
<html>
<head>
    <title>Lecturer Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h2>Lecturer Panel</h2>

        <div class="row mb-3">
            <div class="col-md-6">
                <input type="text" class="form-control" id="searchKeyword" placeholder="Search news...">
            </div>
            <div class="col-md-3">
                <select class="form-select" id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
            </div>
            <div class="col-md-3">
                <button class="btn btn-primary" onclick="loadNews()">Search</button>
            </div>
        </div>

        <div id="newsList" class="row">
            <div class="col-12">Loading...</div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');

        async function loadCategories() {
            try {
                const res = await fetch('/odata/Categories', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                const select = document.getElementById('categoryFilter');

                data.value.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.CategoryId;
                    opt.textContent = c.CategoryName;
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        async function loadNews() {
            try {
                const searchKeyword = document.getElementById('searchKeyword').value;
                const categoryFilter = document.getElementById('categoryFilter').value;

                let url = '/odata/NewsArticles?$expand=Category,CreatedBy&$filter=NewsStatus eq true';

                if (searchKeyword) {
                    url += ` and (contains(NewsTitle,'${searchKeyword}') or contains(NewsContent,'${searchKeyword}'))`;
                }

                if (categoryFilter) {
                    url += ` and CategoryId eq ${categoryFilter}`;
                }

                url += '&$orderby=CreatedDate desc';

                const res = await fetch(url, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();

                const container = document.getElementById('newsList');
                container.innerHTML = '';

                if (data.value.length === 0) {
                    container.innerHTML = '<div class="col-12"><p>No news found</p></div>';
                    return;
                }

                data.value.forEach(article => {
                    const div = document.createElement('div');
                    div.className = 'col-md-6 mb-3';
                    div.innerHTML = `
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">${article.NewsTitle}</h5>
                                    <h6 class="card-subtitle mb-2 text-muted">${article.Headline}</h6>
                                    <p class="card-text">${article.NewsContent.substring(0, 150)}...</p>
                                    <small class="text-muted">
                                        Category: ${article.Category ? article.Category.CategoryName : 'None'} |
                                        Date: ${new Date(article.CreatedDate).toLocaleDateString()}
                                    </small>
                                </div>
                            </div>
                        `;
                    container.appendChild(div);
                });
            } catch (error) {
                console.error('Error loading news:', error);
                document.getElementById('newsList').innerHTML = '<div class="col-12"><p>Error loading news</p></div>';
            }
        }

        // Initialize
        loadCategories();
        loadNews();
    </script>
</body>
</html>
