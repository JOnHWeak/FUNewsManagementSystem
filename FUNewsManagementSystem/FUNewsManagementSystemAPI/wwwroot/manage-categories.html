<!DOCTYPE html>
<html>
<head>
    <title>Manage Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h2>Category Management</h2>

        <div class="card mb-4">
            <div class="card-header">Add New Category</div>
            <div class="card-body">
                <form id="createCategoryForm">
                    <div class="row">
                        <div class="col-md-4">
                            <input type="text" class="form-control" id="categoryName" placeholder="Category Name" required />
                        </div>
                        <div class="col-md-4">
                            <input type="text" class="form-control" id="categoryDescription" placeholder="Description" required />
                        </div>
                        <div class="col-md-2">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="isActive" checked>
                                <label class="form-check-label">Active</label>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary">Add</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Categories List</div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="categoryList">
                        <tr><td colspan="5">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('token');

        async function loadCategories() {
            try {
                const res = await fetch('/odata/Categories?$orderby=CategoryName', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                const tbody = document.getElementById('categoryList');
                tbody.innerHTML = '';

                data.value.forEach(c => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                            <td>${c.CategoryId}</td>
                            <td>${c.CategoryName}</td>
                            <td>${c.CategoryDescription}</td>
                            <td>
                                <span class="badge ${c.IsActive ? 'bg-success' : 'bg-secondary'}">
                                    ${c.IsActive ? 'Active' : 'Inactive'}
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-danger" onclick="deleteCategory(${c.CategoryId})">Delete</button>
                            </td>
                        `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        document.getElementById('createCategoryForm').addEventListener('submit', async e => {
            e.preventDefault();

            // Get form values and validate
            const categoryName = document.getElementById('categoryName').value.trim();
            const categoryDescription = document.getElementById('categoryDescription').value.trim();
            const isActive = document.getElementById('isActive').checked;

            // Validation
            if (!categoryName) {
                alert('Category Name is required');
                return;
            }
            if (!categoryDescription) {
                alert('Category Description is required');
                return;
            }

            // Prepare category data - try different field name formats
            const category = {
                CategoryName: categoryName,
                CategoryDescription: categoryDescription, // Also try correct spelling
                IsActive: isActive,
                ParentCategoryId: null
            };

            console.log('Creating category:', category);

            try {
                const res = await fetch('/odata/Categories', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(category)
                });

                console.log('Response status:', res.status);
                console.log('Response headers:', res.headers.get('content-type'));

                // Get response text first
                const responseText = await res.text();
                console.log('Response text:', responseText);

                if (res.ok) {
                    // Success
                    document.getElementById('createCategoryForm').reset();
                    document.getElementById('isActive').checked = true;
                    loadCategories();
                    alert('Category created successfully!');
                } else {
                    // Parse error response
                    let errorMessage = 'Error creating category';

                    try {
                        if (responseText) {
                            const errorData = JSON.parse(responseText);
                            if (errorData.error && errorData.error.message) {
                                errorMessage = errorData.error.message;
                            } else if (errorData.message) {
                                errorMessage = errorData.message;
                            } else {
                                errorMessage = responseText;
                            }
                        }
                    } catch (parseError) {
                        errorMessage = responseText || `HTTP ${res.status}: ${res.statusText}`;
                    }

                    console.error('Error response:', errorMessage);
                    alert('Error: ' + errorMessage);
                }
            } catch (error) {
                console.error('Network error:', error);
                alert('Network error: ' + error.message);
            }
        });

        async function deleteCategory(id) {
            if (!confirm('Are you sure you want to delete this category?')) return;

            try {
                const res = await fetch(`/odata/Categories(${id})`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (res.ok) {
                    loadCategories();
                    alert('Category deleted successfully!');
                } else {
                    alert('Error deleting category');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error deleting category');
            }
        }

        // Initialize
        loadCategories();
    </script>
</body>
</html>
